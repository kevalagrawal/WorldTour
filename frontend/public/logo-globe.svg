<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WorldTour">
  <title>WorldTour</title>
  <style>
    .land { animation: spin 9s linear infinite; }
    .bob { animation: bob 3s ease-in-out infinite; }
    .plane {
      offset-path: path('M4 32a28 8.5 0 1 0 56 0a28 8.5 0 1 0 -56 0');
      offset-rotate: auto;
      animation: fly 4.5s linear infinite;
    }
    @keyframes spin { to { transform: translateX(-52px); } }
    @keyframes bob { 50% { transform: translateY(-1.2px); } }
    .front { animation: fly 4.5s linear infinite, near 4.5s linear infinite; }
    @keyframes near { 0%, 49% { opacity: 1; } 50%, 99% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes fly { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      .land, .bob, .plane, .front { animation: none; }
      .plane { offset-distance: 30%; }
    }
  </style>
  <defs>
    <clipPath id="earth"><circle cx="32" cy="32" r="22"/></clipPath>
    <radialGradient id="shade" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#0a1a33" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0a1a33" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <g class="bob">
    <!-- orbit path, behind the globe -->
    <ellipse cx="32" cy="32" rx="28" ry="8.5" transform="rotate(-18 32 32)" fill="none" stroke="#ee8a1f" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.6"/>

    <!-- the plane behind the globe (hidden by it on the far half of the orbit) -->
    <g transform="rotate(-18 32 32)">
      <g class="plane">
        <path d="M5 0 L-3 -4.2 L-1.6 0 L-3 4.2 Z" fill="#ee8a1f" stroke="#10284d" stroke-width="1.1" stroke-linejoin="round"/>
        <path d="M-3.2 0 L-5 -2 M-3.2 0 L-5 2" stroke="#10284d" stroke-width="1.1" stroke-linecap="round"/>
      </g>
    </g>

    <!-- light halo keeps the outline visible on dark backgrounds -->
    <circle cx="32" cy="32" r="24.5" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- ocean -->
    <circle cx="32" cy="32" r="22" fill="#3b9af0"/>
    <g clip-path="url(#earth)">
      <!-- continents: two identical 52-unit tiles slide left, so the globe turns forever -->
      <g class="land">
        <g id="tile" fill="#5fd068" stroke="#2e8b45" stroke-width="1.2" stroke-linejoin="round">
          <path d="M11 15c4-3 10-2 12 2 1 3-2 5-1 8 1 3 4 4 3 8-1 4-5 3-6 7-1 4 2 8 0 10-2 1-4-3-5-6-1-4-4-6-4-10 0-4 3-6 2-10-1-3-3-6-1-9z"/>
          <path d="M30 13c3-2 8-1 9 2 1 2-1 3 0 5 2 1 5 0 6 3 1 3-2 5-1 8 1 4 0 8-3 10-3 2-5-1-6-4-1-3-3-5-3-8 0-3-3-4-3-7 0-3 0-6 1-9z"/>
          <path d="M47 41c2-2 7-2 8 1 1 2-1 4-4 4-2 0-5-3-4-5z"/>
          <path d="M44 18c2-1 5 0 5 2s-2 3-4 2-2-3-1-4z"/>
        </g>
        <use href="#tile" x="52"/>
      </g>
      <!-- ice caps -->
      <ellipse cx="32" cy="11" rx="12" ry="3.4" fill="#f4fbff"/>
      <ellipse cx="32" cy="53" rx="13" ry="3.4" fill="#f4fbff"/>
      <!-- roundness and a cartoon shine -->
      <circle cx="32" cy="32" r="22" fill="url(#shade)"/>
      <path d="M17 24c2-6 7-10 13-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
      <circle cx="16.5" cy="29" r="1.6" fill="#fff" opacity="0.75"/>
    </g>
    <!-- bold cartoon outline -->
    <circle cx="32" cy="32" r="22" fill="none" stroke="#10284d" stroke-width="3"/>

    <!-- the plane again in front, shown only on the near half of its orbit -->
    <g transform="rotate(-18 32 32)">
      <g class="plane front">
        <path d="M5 0 L-3 -4.2 L-1.6 0 L-3 4.2 Z" fill="#ee8a1f" stroke="#10284d" stroke-width="1.1" stroke-linejoin="round"/>
        <path d="M-3.2 0 L-5 -2 M-3.2 0 L-5 2" stroke="#10284d" stroke-width="1.1" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
